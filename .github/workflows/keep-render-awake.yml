name: Keep Render API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the Render API
        env:
          API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Set the RENDER_API_URL repository variable to the deployed API base URL." >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 "${API_URL%/}/health"
